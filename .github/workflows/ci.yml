name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  unit:
    name: Unit / compile (py${{ matrix.python-version }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            sqlalchemy: "SQLAlchemy>=2.0.45,<2.1"
            pip-pre: ""
            experimental: false
            label: "SQLAlchemy 2.0.x"

          - python-version: "3.11"
            sqlalchemy: "SQLAlchemy>=2.0.45,<2.1"
            pip-pre: ""
            experimental: false
            label: "SQLAlchemy 2.0.x"

          - python-version: "3.12"
            sqlalchemy: "SQLAlchemy>=2.0.45,<2.1"
            pip-pre: ""
            experimental: false
            label: "SQLAlchemy 2.0.x"

          - python-version: "3.13"
            sqlalchemy: "SQLAlchemy>=2.0.45,<2.1"
            pip-pre: ""
            experimental: false
            label: "SQLAlchemy 2.0.x"

          - python-version: "3.10"
            sqlalchemy: "SQLAlchemy>=2.1.0b2,<2.2"
            pip-pre: "--pre"
            experimental: true
            label: "SQLAlchemy 2.1.x"

          - python-version: "3.11"
            sqlalchemy: "SQLAlchemy>=2.1.0b2,<2.2"
            pip-pre: "--pre"
            experimental: true
            label: "SQLAlchemy 2.1.x"

          - python-version: "3.12"
            sqlalchemy: "SQLAlchemy>=2.1.0b2,<2.2"
            pip-pre: "--pre"
            experimental: true
            label: "SQLAlchemy 2.1.x"

          - python-version: "3.13"
            sqlalchemy: "SQLAlchemy>=2.1.0b2,<2.2"
            pip-pre: "--pre"
            experimental: true
            label: "SQLAlchemy 2.1.x"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-deps
          python -m pip install \
            ${{ matrix.pip-pre }} \
            "${{ matrix.sqlalchemy }}" \
            "pyodbc>=5.0" \
            "pytest>=8,<10" \
            "alembic==1.18.5" \
            "pytest-cov>=5" \
            "python-dotenv>=1.0" \
            "ruff>=0.6"

      - name: Show dependency versions
        run: |
          python --version
          python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__)"
          python -c "import alembic; print('Alembic:', alembic.__version__)"
          python -c "import pyodbc; print('pyodbc:', pyodbc.version)"
          python -m pytest --version

      - name: Run static quality gate
        run: python -m ruff check IfxAlchemy test tools

      - name: Run tests without Informix
        run: |
          python -m pytest \
            -m "not requires_informix and not legacy_ifxpy and not sqlalchemy_suite" \
            --cov=IfxAlchemy \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -W error

      - name: Run SQLAlchemy contract gates
        run: |
          python -m pytest \
            test/test_sqlalchemy_suite_gate.py \
            test/test_sqlalchemy21_constructs.py \
            -m "not requires_informix" \
            -W error

  integration:
    name: Informix integration (py${{ matrix.python-version }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            sqlalchemy: "SQLAlchemy>=2.0.45,<2.1"
            pip-pre: ""
            experimental: false
            label: "SQLAlchemy 2.0.x"

          - python-version: "3.13"
            sqlalchemy: "SQLAlchemy>=2.0.45,<2.1"
            pip-pre: ""
            experimental: false
            label: "SQLAlchemy 2.0.x"

          - python-version: "3.12"
            sqlalchemy: "SQLAlchemy>=2.1.0b2,<2.2"
            pip-pre: "--pre"
            experimental: true
            label: "SQLAlchemy 2.1.x"

          - python-version: "3.13"
            sqlalchemy: "SQLAlchemy>=2.1.0b2,<2.2"
            pip-pre: "--pre"
            experimental: true
            label: "SQLAlchemy 2.1.x"

    env:
      INFORMIX_SQLALCHEMY_URL: ${{ secrets.INFORMIX_SQLALCHEMY_URL }}
      INFORMIX_SQLALCHEMY_SUITE_URL: >-
        ${{ secrets.INFORMIX_SQLALCHEMY_SUITE_URL ||
            secrets.INFORMIX_SQLALCHEMY_URL }}

    steps:
      - name: Skip when no Informix URL is configured
        if: ${{ env.INFORMIX_SQLALCHEMY_URL == '' }}
        run: |
          echo "INFORMIX_SQLALCHEMY_URL is not configured; skipping integration layer."

      - name: Checkout repository
        if: ${{ env.INFORMIX_SQLALCHEMY_URL != '' }}
        uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ env.INFORMIX_SQLALCHEMY_URL != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install package and test dependencies
        if: ${{ env.INFORMIX_SQLALCHEMY_URL != '' }}
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . --no-deps
          python -m pip install \
            ${{ matrix.pip-pre }} \
            "${{ matrix.sqlalchemy }}" \
            "pyodbc>=5.0" \
            "pytest>=8,<10" \
            "alembic==1.18.5" \
            "pytest-cov>=5" \
            "python-dotenv>=1.0" \
            "ruff>=0.6"

      - name: Show dependency versions
        if: ${{ env.INFORMIX_SQLALCHEMY_URL != '' }}
        run: |
          python --version
          python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__)"
          python -c "import alembic; print('Alembic:', alembic.__version__)"
          python -c "import pyodbc; print('pyodbc:', pyodbc.version)"
          python -m pytest --version

      - name: Run package integration tests
        if: ${{ env.INFORMIX_SQLALCHEMY_URL != '' }}
        run: |
          python -m pytest \
            -m "requires_informix and not legacy_ifxpy" \
            -W error

      - name: Run official SQLAlchemy suite
        if: ${{ env.INFORMIX_SQLALCHEMY_URL != '' }}
        env:
          SQLALCHEMY_SUITE_JUNIT: >-
            sqlalchemy-suite-${{ matrix.python-version }}.xml
        run: python run_tests.py

      - name: Upload SQLAlchemy suite report
        if: ${{ always() && env.INFORMIX_SQLALCHEMY_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sqlalchemy-suite-${{ matrix.python-version }}-${{ matrix.label }}
          path: sqlalchemy-suite-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  package:
    name: Package metadata
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build and validate release artifacts
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m build
          python -m tools.build_clean_archive dist/InformixAlchemy-source-clean.zip
          python -m twine check dist/*.whl dist/*.tar.gz
          python -m tools.check_secrets --release dist
          python -m tools.verify_release_artifacts dist/*.whl dist/*.tar.gz

      - name: Verify distribution contents
        run: |
          python -m pytest \
            test/test_clean_distribution.py \
            test/test_distribution_metadata.py \
            test/test_compatibility_policy.py
