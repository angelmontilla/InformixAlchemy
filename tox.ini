[tox]
min_version = 4.0
env_list = py310-sa-min, py312-sa-current, py314-sa-current, py312-sa-next, py314-sa-next

[testenv]
package = editable
deps =
    pytest>=8,<10
    alembic>=1.18,<2
    python-dotenv>=1
    pyodbc>=5
    sa-min: -c constraints/sqlalchemy-min.txt
    sa-min: SQLAlchemy
    sa-current: -c constraints/sqlalchemy-stable.txt
    sa-current: SQLAlchemy
    sa-next: -c constraints/sqlalchemy-next.txt
    sa-next: SQLAlchemy
commands = python -m pytest
