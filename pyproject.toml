[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "IfxAlchemy"
version = "1.2.0"
description = "Informix dialect for SQLAlchemy using pyodbc"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Angel Montilla" },
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "SQLAlchemy>=2.0.45,<2.1",
    "pyodbc>=5.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.entry-points."sqlalchemy.dialects"]
informix = "IfxAlchemy.pyodbc:IfxDialect_pyodbc"
"informix.pyodbc" = "IfxAlchemy.pyodbc:IfxDialect_pyodbc"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["IfxAlchemy*"]

[project.optional-dependencies]
dev = [
    "alembic==1.18.5",
    "build>=1.2",
    "packaging>=24",
    "pytest>=8,<10",
    "pytest-cov>=5",
    "python-dotenv>=1.0",
    "ruff>=0.6",
    "twine>=6",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Start with rules that catch broken Python and undefined names without
# forcing a large formatting-only rewrite of the legacy dialect.
select = ["E9", "F63", "F7", "F82"]

[tool.coverage.run]
branch = true
source = ["IfxAlchemy"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# The offline suite measured 76%; keep one point of headroom.
fail_under = 75

